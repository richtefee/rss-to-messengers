name: Process feeds

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

jobs:
  process:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for feeds.json
        run: |
          if [ ! -f feeds.json ]; then
            echo "Error: feeds.json file is not present"
            exit 1
          fi
          echo "feeds.json found"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Check secrets
        run: |
          WHATSAPP_COMPLETE=false
          TELEGRAM_COMPLETE=false

          if [ -n "${{ secrets.WHATSAPP_API_TOKEN }}" ] && [ -n "${{ secrets.WHATSAPP_CHANNEL }}" ]; then
            WHATSAPP_COMPLETE=true
          elif [ -n "${{ secrets.WHATSAPP_API_TOKEN }}" ] || [ -n "${{ secrets.WHATSAPP_CHANNEL }}" ]; then
            echo "Warning: WhatsApp secret set is incomplete. Messages may fail."
          fi

          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] && [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            TELEGRAM_COMPLETE=true
          elif [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ] || [ -n "${{ secrets.TELEGRAM_CHAT_ID }}" ]; then
            echo "Warning: Telegram secret set is incomplete. Messages may fail."
          fi

          if [ "$WHATSAPP_COMPLETE" = false ] && [ "$TELEGRAM_COMPLETE" = false ]; then
            echo "Error: No messenger is fully configured. Exiting."
            exit 1
          fi

      - name: Process feeds
        env:
          WHATSAPP_API_TOKEN: ${{ secrets.WHATSAPP_API_TOKEN }}
          WHATSAPP_CHANNEL: ${{ secrets.WHATSAPP_CHANNEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: ruby process_feeds.rb

      - name: Check for changes in seen folder
        id: check-changes
        run: |
          if git diff --quiet seen/; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Save changes to seen folder
        if: steps.check-changes.outputs.changed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen/
          git commit -m "Update seen items"
          git push
